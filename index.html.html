<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحدي الحاسب | المكونات المادية والبرمجية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#eef9ff,#fff7e7);color:#18324a;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border-radius:28px;box-shadow:0 14px 40px #24425c22;padding:30px}.hero{text-align:center;padding:42px}.hero h1{font-size:clamp(30px,5vw,58px);margin:10px}.hero p{font-size:22px;color:#557085}.pc{font-size:90px}.btn{border:0;border-radius:18px;padding:16px 28px;font-size:22px;font-weight:700;cursor:pointer;background:#168aad;color:white;box-shadow:0 7px 0 #0c6079;margin:8px}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #0c6079}.ghost{background:#f2b134;box-shadow:0 7px 0 #bd7d08}.teams{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}.team{padding:18px;border-radius:22px;text-align:center;font-size:22px;font-weight:700}.a{background:#dff4ff}.b{background:#fff0c9}.score{font-size:42px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.qnum{font-size:18px;color:#61798d}.question{text-align:center;font-size:clamp(26px,4vw,42px);font-weight:800;margin:25px 0}.visual{text-align:center;font-size:74px;min-height:90px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:16px}.ans{padding:22px;border:3px solid #d7e7ef;background:#fafdff;border-radius:20px;font-size:24px;font-weight:700;cursor:pointer;min-height:84px}.ans:hover{border-color:#168aad}.correct{background:#dff7df!important;border-color:#3da35d!important}.wrong{background:#ffe0e0!important;border-color:#d9534f!important}.feedback{text-align:center;font-size:24px;font-weight:700;min-height:40px;margin:18px}.controls{text-align:center}.hidden{display:none}.winner{text-align:center}.winner h2{font-size:48px}.tiny{font-size:16px;color:#789}.catbox{display:flex;justify-content:center;gap:20px;margin:18px 0}.tag{padding:10px 18px;border-radius:99px;background:#edf5f8;font-weight:700}@media(max-width:700px){.answers{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:18px}.teams{gap:8px}.question{margin:14px 0}}
</style>
</head>
<body><div class="wrap">
<section id="start" class="card hero"><div class="pc">💻</div><h1>تحدّي الحاسب</h1><h2>المكونات المادية والبرمجية</h2><p>لعبة صفّية لفريقين — اختاري الإجابة ثم امنحي النقطة للفريق الذي أجاب.</p><button class="btn" onclick="begin()">ابدئي اللعبة 🎮</button></section>
<section id="game" class="hidden">
<div class="teams"><div class="team a">🔵 الفريق الأزرق<div id="sa" class="score">0</div></div><div class="team b">🟡 الفريق الأصفر<div id="sb" class="score">0</div></div></div>
<div class="card"><div class="top"><span id="qn" class="qnum"></span><span class="tag">ثالث ابتدائي</span></div><div id="icon" class="visual"></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="fb" class="feedback"></div><div id="award" class="controls hidden"><div>من أجاب بشكل صحيح؟</div><button class="btn" onclick="point('a')">+ نقطة للأزرق</button><button class="btn ghost" onclick="point('b')">+ نقطة للأصفر</button><button class="btn" style="background:#718096;box-shadow:0 7px 0 #4a5568" onclick="next()">بدون نقطة / التالي</button></div></div>
</section>
<section id="end" class="card winner hidden"><div style="font-size:90px">🏆</div><h2 id="win"></h2><p id="final" style="font-size:28px"></p><button class="btn" onclick="location.reload()">إعادة اللعب 🔄</button></section>
</div>
<script>
const qs=[
['🖥️','أيٌّ من الآتي يُعد جزءًا ماديًا؟',['الشاشة','برنامج الرسام','نظام التشغيل','PowerPoint'],0,'ممتاز! الشاشة جزء يمكن لمسه.'],
['🎨','أيٌّ من الآتي يُعد من البرمجيات؟',['الفأرة','لوحة المفاتيح','برنامج الرسام','الطابعة'],2,'صحيح! برنامج الرسام من البرمجيات.'],
['⌨️','لوحة المفاتيح تُعد…',['برنامجًا','جزءًا ماديًا','نظام تشغيل','ملفًا'],1,'أحسنتِ! لوحة المفاتيح جزء مادي.'],
['🪟','نظام Windows يُعد…',['جزءًا ماديًا','جهاز إخراج','برنامجًا','لوحة مفاتيح'],2,'صحيح! Windows من البرمجيات.'],
['🖱️','هل يمكن لمس الفأرة باليد؟',['نعم، لذلك هي جزء مادي','لا، لأنها برنامج','لا، لأنها ملف','نعم، لذلك هي برنامج'],0,'رائعة! ما يمكن لمسه من أجزاء الحاسب يُعد ماديًا.'],
['📄','Microsoft Word مثال على…',['الأجزاء المادية','البرمجيات','أجهزة الإدخال فقط','الأسلاك'],1,'صحيح! Word برنامج.'],
['🖨️','الطابعة مثال على…',['جزء مادي','برنامج','نظام تشغيل','تطبيق رسم'],0,'ممتاز! الطابعة جهاز مادي.'],
['🧩','أي عبارة صحيحة؟',['البرمجيات يمكن لمسها','الأجزاء المادية هي البرامج','الأجزاء المادية يمكن لمسها','الشاشة برنامج'],2,'بالضبط! الأجزاء المادية يمكن لمسها.'],
['📊','PowerPoint هو…',['برنامج','فأرة','شاشة','طابعة'],0,'أحسنتِ! PowerPoint من البرمجيات.'],
['💻','أي مجموعة تحتوي على أجزاء مادية فقط؟',['الشاشة + الفأرة','Word + الرسام','Windows + PowerPoint','الرسام + الشاشة'],0,'صحيح! الشاشة والفأرة كلاهما أجزاء مادية.'],
['⚙️','أي مجموعة تحتوي على برمجيات فقط؟',['الشاشة + الطابعة','Word + الرسام','الفأرة + Windows','لوحة المفاتيح + PowerPoint'],1,'ممتاز! Word والرسام كلاهما برامج.'],
['🤔','إذا قلتُ: «شيء داخل الحاسب أستخدمه للرسم ولا أستطيع لمسه» فهو…',['برنامج الرسام','الفأرة','الشاشة','لوحة المفاتيح'],0,'ذكية! المقصود برنامج الرسام.']
];
let i=0,sa=0,sb=0,locked=false;
function begin(){document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');show()}
function show(){locked=false;let x=qs[i];qn.textContent=`السؤال ${i+1} من ${qs.length}`;icon.textContent=x[0];q.textContent=x[1];fb.textContent='';award.classList.add('hidden');answers.innerHTML='';x[2].forEach((v,k)=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>choose(k,b);answers.appendChild(b)})}
function choose(k,b){if(locked)return;locked=true;let x=qs[i],bs=[...document.querySelectorAll('.ans')];bs[x[3]].classList.add('correct');if(k!==x[3]){b.classList.add('wrong');fb.textContent='قريبة! الإجابة الصحيحة ملوّنة بالأخضر 🌟'}else fb.textContent=x[4]+' 🎉';award.classList.remove('hidden')}
function point(t){if(t==='a')sa++;else sb++;document.getElementById('sa').textContent=sa;document.getElementById('sb').textContent=sb;next()}
function next(){i++;if(i>=qs.length)return finish();show()}
function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('end').classList.remove('hidden');let w=sa===sb?'تعادل رائع للفريقين! 🤝':sa>sb?'الفريق الأزرق يفوز! 🔵':'الفريق الأصفر يفوز! 🟡';win.textContent=w;final.textContent=`الأزرق ${sa} نقطة — الأصفر ${sb} نقطة`}
</script></body></html>
